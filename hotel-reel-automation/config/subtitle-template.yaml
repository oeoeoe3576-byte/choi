# subtitle-template.yaml
# ------------------------------------------------------------------
# 자막 디자인/레이아웃 설정. subtitle_generator.py와 renderer.py가 이 파일을 읽어
# 자막 위치, 폰트, 강조 규칙을 결정한다. 여기 값만 바꾸면 코드 수정 없이
# 자막 디자인을 바꿀 수 있다.
#
# 자막 규칙 (요청 반영):
#   - 배경 박스 없음 (box_enabled: false) — 대신 외곽선(stroke)+그림자를 굵게
#     줘서 어떤 사진 위에서도 읽히게 한다.
#   - 한 번에 짧게, 무조건 한 줄로: max_chars_per_line ~13자 안팎(자연스러운
#     구절 단위로 끊기게). 대본 문장이 더 길면 subtitle_generator.py가 여러
#     개의 짧은 한 줄 자막으로 쪼개서 그 컷의 재생 시간 동안 순서대로 짧게
#     보여준다 (절대 두 줄로 줄바꿈하지 않는다).
#   - 손글씨 느낌 폰트 (font_family 참고).
# ------------------------------------------------------------------

# 손글씨 스타일 폰트 후보 (전부 무료/재배포 가능, OFL 라이선스, 나눔 폰트 계열):
#   - "Nanum Pen Script" (나눔손글씨 펜)  <- 기본값. 손글씨 느낌이면서도
#     화면에서 짧게 스쳐 지나가는 자막으로 쓰기에 가독성이 가장 좋다.
#   - "Nanum Brush Script" (나눔손글씨 붓) <- 붓글씨에 가까운 더 개성 있는
#     스타일. 감성/무드가 강한 영상엔 잘 어울리지만 글자가 촘촘하면
#     가독성이 떨어질 수 있어 짧은 문구에 추천.
#   - "NanumBarunpen" (나눔바른펜)         <- 손글씨보다는 둥근 고딕에 가까움.
#     손글씨 느낌은 약하지만 가장 또렷하게 읽힌다 (가독성 최우선일 때).
# 설치: `sudo apt-get install -y fonts-nanum fonts-nanum-extra` (Debian/Ubuntu)
# macOS는 나눔손글씨 폰트를 https://hangeul.naver.com/font 에서 받아 설치하면 된다.
# 아래 font_family는 콤마로 구분된 우선순위 목록이며, renderer.py는 첫 번째
# 이름만 실제 렌더링에 사용한다 (나머지는 사람이 읽는 참고용 폴백 표기).

layouts:
  lower_third:
    position: "lower_third"       # lower_third | center | upper_third
    margin_bottom_pct: 12         # 화면 하단에서부터 여백 (%)
    margin_side_pct: 8
    max_lines: 1                  # 항상 한 줄 (subtitle_generator가 보장)
    max_chars_per_line: 13        # 자연스러운 구절 단위. 넘으면 여러 자막으로 쪼개짐
    font_family: "Nanum Pen Script, NanumGothic, sans-serif"
    font_size_pct: 7.5            # 짧은 한 줄 자막이라 크게 써도 잘림 걱정이 적다
    font_color: "#FFFFFF"
    stroke_color: "#000000"
    stroke_width_px: 4            # 손글씨체 얇은 획이 묻히지 않도록 과하지 않게
    shadow_px: 2
    box_enabled: false
    box_color: "#000000"
    box_opacity: 0.0
    box_radius_px: 0
    line_spacing_px: 8
    fade_in_ms: 80
    fade_out_ms: 80

  center:
    position: "center"
    margin_bottom_pct: 0
    margin_side_pct: 10
    max_lines: 1
    max_chars_per_line: 13
    font_family: "Nanum Pen Script, NanumGothic, sans-serif"
    font_size_pct: 8.0
    font_color: "#FFFFFF"
    stroke_color: "#000000"
    stroke_width_px: 4
    shadow_px: 2
    box_enabled: false
    box_color: "#000000"
    box_opacity: 0.0
    box_radius_px: 0
    line_spacing_px: 10
    fade_in_ms: 80
    fade_out_ms: 80

  upper_third:
    position: "upper_third"
    margin_bottom_pct: 0
    margin_top_pct: 10
    margin_side_pct: 8
    max_lines: 1
    max_chars_per_line: 13
    font_family: "Nanum Pen Script, NanumGothic, sans-serif"
    font_size_pct: 7.5
    font_color: "#FFFFFF"
    stroke_color: "#000000"
    stroke_width_px: 4
    shadow_px: 2
    box_enabled: false
    box_color: "#000000"
    box_opacity: 0.0
    box_radius_px: 0
    line_spacing_px: 8
    fade_in_ms: 80
    fade_out_ms: 80

# 톤 -> 강조 색상 (키워드 강조 시 사용)
tone_emphasis_color:
  clean: "#FFD84D"
  bold: "#FF5C5C"
  friendly: "#7CE0C6"

# 자막 on/off 및 강조 단어 자동 추출 규칙
rules:
  subtitle_box_default: false
  keyword_emphasis_default: true
  emphasis_pos_hint:            # 강조 대상으로 우선하는 단어 패턴(간단 규칙 기반, 추후 NLP로 교체 가능)
    - "뷰"
    - "감성"
    - "위치"
    - "가성비"
    - "조식"
    - "인테리어"
    - "저장"
  min_display_seconds: 0.6      # 쪼개진 짧은 자막 한 개가 최소 이 정도는 화면에 남아있어야 함
