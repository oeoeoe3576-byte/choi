# render-config.yaml
# ------------------------------------------------------------------
# 렌더링 엔진(FFmpeg) 관련 설정. renderer.py가 이 값을 읽어 ffmpeg 명령을 구성한다.
# ------------------------------------------------------------------

engine: "ffmpeg"          # 현재는 ffmpeg만 지원. 추후 "remotion" 등 추가 가능(renderer.py 인터페이스 분리됨)
ffmpeg_binary: "ffmpeg"   # PATH에 없으면 절대경로로 교체

output:
  width: 1080
  height: 1920
  fps: 30
  video_codec: "libx264"
  pixel_format: "yuv420p"
  crf: 20
  preset: "medium"
  audio_codec: "aac"
  audio_bitrate: "128k"
  container: "mp4"
  filename: "reel-final.mp4"

bgm:
  enabled: false             # 기본은 off. 프로젝트별 audio/bgm.mp3가 있으면 자동 on
  volume: 0.6
  fade_out_seconds: 1.0

thumbnail:
  enabled: true
  filename: "thumbnail.jpg"
  source: "first_shot"       # first_shot | best_shot
  overlay_text: true

subtitle_burn_in:
  # 기본값 off: 이 파이프라인의 핵심은 "사진 -> 모션이 들어간 영상"이고,
  # 자막은 사용자가 CapCut 등에서 직접 넣는 경우가 많다. script.md/
  # subtitles.json/subtitles.srt는 끄더라도 항상 그대로 생성되니,
  # 그 자막 데이터를 편집툴에 따로 불러와 쓰면 된다. 영상에 직접 구워
  # 넣고 싶으면 true로 바꾸면 된다 (코드 변경 없이 이 값만 바꾸면 됨).
  enabled: false
  # 이 경로들은 "한글 폰트가 시스템에 있는지" 확인하는 용도로만 쓰인다
  # (없으면 자막 번인을 건너뜀). 실제 렌더링에 쓰이는 폰트 이름은
  # config/subtitle-template.yaml의 layouts.*.font_family 값(예: NanumGothic)이며,
  # fontconfig가 해당 family를 시스템에서 찾아 렌더링한다.
  font_path_candidates:
    - "/usr/share/fonts/truetype/nanum/NanumGothicBold.ttf"
    - "/usr/share/fonts/truetype/nanum/NanumGothic.ttf"
    - "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"

logging:
  keep_intermediate_files: false   # true면 clips/*.mp4 등 중간 산출물을 보존 (디버깅용)
  verbose: false
